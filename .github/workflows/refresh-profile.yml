name: Refresh profile activity

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/refresh_profile.py
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_profile.py
      - name: Commit refreshed activity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/contributions.svg assets/profile-activity.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh profile activity'
          git pull --rebase origin main
          git push origin HEAD:main
